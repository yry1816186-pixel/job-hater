name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  backend:
    name: 后端（Python ${{ matrix.python }} @ ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装（含测试依赖与 MCP/微信雷达可选组）
        run: pip install -e ".[dev,mcp,wechat]"
      - name: Lint（ruff）
        run: python -m ruff check jobhater tests
      - name: 测试（pytest 全量）
        run: python -m pytest tests/ -v

  frontend:
    name: 前端（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc -b
      - name: 构建
        run: npx vite build

  migration-smoke:
    name: 迁移烟测（干净库→全量迁移→幂等重跑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: schema 迁移原子性/幂等 + v1 迁移往返
        run: python -m pytest tests/test_db_and_textproc.py tests/test_sources_and_migration.py -v

  perf-canary:
    name: 性能金丝雀（benchmark 宽松阈值，防 10x 级回退）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # 共享 runner 噪声大：阈值放宽到只拦量级级回退（本地精确跑法见 docs/PERFORMANCE.md）
      - name: benchmark 2000 岗（ingest≥40/s、检索P95<150ms）
        run: python scripts/benchmark.py --jobs 2000 --seed 7 --min-ingest-rate 40 --max-search-p95-ms 150

  quality-gate:
    name: 匹配质量门禁（黄金评测集）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # 22 个标注用例：gate 全覆盖+同义组/硬域封顶/薪资倒挂/四档结论/交叉校验。
      # 引擎语义变更必须同步重标注 tests/golden/matching_golden.json（文件锁 engine_version）
      - name: 黄金集（engine_version 锁定）
        run: python -m pytest tests/test_matching_golden.py -v

  docker:
    name: Docker 构建 + 运行冒烟（部署主路径回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（多阶段：node 构建前端 → python 运行时）
        run: docker build -t job-hater:ci .
      - name: compose 起服务并等待健康
        run: docker compose up -d --wait
      - name: 冒烟：/ 返回 SPA HTML（修复前此处是 404 JSON）+ /api/health
        run: |
          set -e
          body=$(curl -fsS http://127.0.0.1:8787/)
          echo "$body" | grep -q '<div id="root">' || { echo "根路径未返回 SPA HTML: $body"; exit 1; }
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"ok": *true'
      - name: 冒烟：Host 白名单拒绝非本机 Host（DNS rebinding 防线）
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8787/api/health)
          [ "$code" = "400" ] || { echo "恶意 Host 未被拒绝: HTTP $code"; exit 1; }
      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans

  wheel-smoke:
    name: wheel 安装冒烟（陌生人 pip install 路径）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist/
      - name: 干净 venv 安装 wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: 断言非 py 资源进包（迁移 SQL / OCR worker）
        run: |
          /tmp/smoke/bin/python -c "
          import importlib.resources
          pkg = importlib.resources.files('jobhater')
          migs = list((pkg / 'db' / 'migrations').iterdir())
          assert migs, 'migrations 未进 wheel'
          assert (pkg / 'services' / 'wechat' / 'ocr_worker.ps1').is_file(), 'ocr_worker.ps1 未进 wheel'
          print('package-data OK:', len(migs), '个迁移文件')
          "
      - name: doctor + serve 冒烟（无 dist 时引导页 200 + health）
        run: |
          /tmp/smoke/bin/job-hater doctor
          /tmp/smoke/bin/job-hater serve --port 8790 &
          SRV=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8790/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8790/api/health | grep -q '"ok": *true'
          curl -fsS http://127.0.0.1:8790/ | grep -q '前端'
          kill $SRV
