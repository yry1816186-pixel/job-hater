name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  backend:
    name: 后端（Python ${{ matrix.python }} @ ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装（含测试依赖与 MCP 可选组）
        run: pip install -e ".[dev,mcp]"
      - name: Lint（ruff）
        run: python -m ruff check jobhater tests
      - name: 测试（pytest 全量）
        run: python -m pytest tests/ -v

  frontend:
    name: 前端（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc -b
      - name: 构建
        run: npx vite build

  migration-smoke:
    name: 迁移烟测（干净库→全量迁移→幂等重跑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: schema 迁移原子性/幂等 + v1 迁移往返
        run: python -m pytest tests/test_db_and_textproc.py tests/test_sources_and_migration.py -v

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（多阶段：node 构建前端 → python 运行时）
        run: docker build -t job-hater:ci .
