services:
  job-hater:
    build: .
    ports:
      # 默认只绑回环（API 无账号体系，见 SECURITY.md 部署注意）；
      # 需要局域网访问时自行改为 "8787:8787"，并设置环境变量
      # JOBHATER_ALLOWED_HOSTS=<你的主机名/IP>（Host 白名单）+ 防火墙/反代认证
      - "127.0.0.1:8787:8787"
    volumes:
      - jobhater-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  jobhater-data:
